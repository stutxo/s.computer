# The robot that checks every s-verse: the rules a script can check, then a few seconds of play in a real browser.
name: check s-verses

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check the rules
        run: node tools/check.mjs
      - name: get a browser
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: play every s-verse for a few seconds
        run: node tools/smoke.mjs
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tools/out/
