<style>
  :root {

  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--desk);

    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;

  }
  body { position: fixed; inset: 0; font-family: var(--hand); color: var(--ink); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(130% 95% at 50% 46%, rgba(35, 53, 168, 0) 58%, rgba(35, 53, 168, .10) 100%);
  }

  /* ---------- HUD: written in the margins ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #logo {
    position: absolute; left: 16px; top: calc(12px + var(--safe-t));
    font-size: 22px; line-height: 1; transform: rotate(-3deg); transform-origin: left center;
  }
  #best {
    position: absolute; right: 16px; top: calc(14px + var(--safe-t));
    font-size: 21px; line-height: 1; transform: rotate(2deg); transform-origin: right center;
  }
  #score {
    position: absolute; left: 50%; top: calc(6px + var(--safe-t));
    font-size: 68px; line-height: 1; transform: translateX(-50%);
    text-shadow: 0 0 6px var(--paper), 0 0 2px var(--paper);
    opacity: 0; transition: opacity .3s;
  }
  #score.on { opacity: 1; }
  #score.bump { animation: bump .32s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes bump {
    0% { transform: translateX(-50%) scale(1.45) rotate(-6deg); }
    100% { transform: translateX(-50%) scale(1) rotate(0deg); }
  }
  #mute {
    pointer-events: auto; position: absolute; left: 8px; bottom: calc(8px + var(--safe-b));

  #mute .x { display: none; }
  #mute[aria-pressed="true"] .x { display: inline; }
  #mute[aria-pressed="true"] .wave { display: none; }

  /* drag indicator: a pen-drawn circle where your finger went down */
  #stick {
    --r2: 140px;
    position: fixed; left: 0; top: 0; width: var(--r2); height: var(--r2); margin: calc(var(--r2) / -2);

  #knob {
    position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px;
    border-radius: 50%; background: rgba(255, 79, 147, .2); border: 2.5px solid rgba(35, 53, 168, .5);

    position: absolute; transform: translate(-50%, -50%);

    18% { opacity: 1; transform: translate(-50%, -60%) scale(1.12) rotate(3deg); }
    100% { opacity: 0; transform: translate(-50%, -190%) scale(1) rotate(0deg); }
  }

  /* ---------- notes: scraps of notebook paper taped over the game ---------- */
  .note {
    position: fixed; left: 50%; top: 57%;
    width: min(86vw, 350px);
    padding: 26px 20px 18px 52px;

    background-position: 0 0, 0 23px;
    box-shadow: 0 22px 44px -18px rgba(20, 30, 90, .45), 0 2px 6px rgba(20, 30, 90, .14);
    transform: translate(-50%, -46%) rotate(-2deg) scale(.96);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .22s ease, transform .45s cubic-bezier(.2, 1.5, .35, 1), visibility 0s linear .22s;
  }
  .note.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) rotate(-2deg); transition-delay: 0s; }
  .note p { margin: 0; }
  .note .tape {
    position: absolute; top: -13px; left: 50%; width: 96px; height: 28px; margin-left: -48px;
    background: rgba(250, 240, 190, .78); transform: rotate(3deg); box-shadow: 0 1px 3px rgba(0, 0, 0, .1);

  .note .big { font-size: 34px; }

  #over .grade {

  #share {

  @media (min-width: 900px) {
    #logo { font-size: 26px; }
    #best { font-size: 24px; }
    #score { font-size: 76px; }

<script>
  // If the game can't start (no WebGL, CDN blocked, ancient browser), show a plain S instead of a blank page.
  window.__sFallback = function (msg) {
    var f = document.getElementById('fallback');
    if (!f) return;
    f.hidden = false;
    if (msg) f.querySelector('.why').textContent = msg;
  };
  // a script that fails to load (three.js CDN unreachable) or an error while starting up: show it right away
  window.addEventListener('error', function (e) {
    if (window.__sReady) return;
    var t = e.target;
    if (t && t.tagName && t.tagName !== 'SCRIPT') return; // a font or image failing is fine
    window.__sFallback();
  }, true);
  setTimeout(function () { if (!window.__sReady) window.__sFallback(); }, 15000);
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   s.computer — tilt the S. grab the gold s's. don't fly out.

   The level IS the doodle: the 14 strokes of the Cool S are the walls.
   Everything between SIM-START and SIM-END is plain game logic (no
   three.js, no DOM) — the numbers at the top are the ones to tweak.
   ===================================================================== */

/*SIM-START*/
const SU = 2;                                 // world units per grid square (the S is 2 x 5 squares)
const BALL_R = 0.36;                          // ball radius
const INK_R = 0.12;                           // radius of the inked lines (the walls)
const CONTACT = 2 * Math.sqrt(BALL_R * INK_R); // ball-center distance from a line's center when touching it
const PAPER_Y = -8;                           // height of the notebook page below the S
const MAX_TILT = 0.24;                        // radians (~14°)
const PHYS = {
  G: 40,          // tilt gravity: acceleration = G * sin(tilt)
  DAMP: 0.42,     // rolling resistance, per second
  REST: 0.5,      // bounciness off the lines
  HOP_V: 6.3,     // hit a line harder than this and you hop right over it
  VMAX: 15,
  HOP_VY: 5.2,    // hop launch speed
  HOP_G: 30,      // gravity while hopping / dropping in
  BOUNCE_V: 6,    // landings harder than this bounce
  FALL_G: 24,     // gravity on the way down to the page
  PICK: 0.62,     // how close you need to get to grab a gold s
};

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
// grid coords (u right, v down; the S spans u 0..2, v 0..5) -> board coords (x right, z toward you)
const uv = (u, v) => [(u - 1) * SU, (v - 2.5) * SU];

// Outer silhouette of the Cool S.
const OUTLINE = [[1, 0], [2, 1], [2, 2], [1.5, 2.5], [2, 3], [2, 4], [1, 5], [0, 4], [0, 3], [0.5, 2.5], [0, 2], [0, 1]]
  .map(([u, v]) => uv(u, v));

// The 14 strokes, in the order everyone draws them: six verticals, two diagonals, two connectors, two tips.
const STROKES = [
  [[0, 1], [0, 2]], [[1, 1], [1, 2]], [[2, 1], [2, 2]],
  [[0, 3], [0, 4]], [[1, 3], [1, 4]], [[2, 3], [2, 4]],
  [[0, 2], [1, 3]], [[1, 2], [2, 3]],
  [[2, 2], [1.5, 2.5]], [[0, 3], [0.5, 2.5]],
  [[0, 1], [1, 0]], [[1, 0], [2, 1]],
  [[0, 4], [1, 5]], [[1, 5], [2, 4]],
].map(([a, b]) => {
  const [ax, az] = uv(a[0], a[1]), [bx, bz] = uv(b[0], b[1]);
  const dx = bx - ax, dz = bz - az, len2 = dx * dx + dz * dz;
  return { ax, az, bx, bz, dx, dz, len2, len: Math.sqrt(len2) };
});

// Centerline of the one long channel the strokes make: up the right, over the top, down and across, around the bottom.
const PATH = (() => {
  const pts = [[1.5, 2.0], [1.5, 1.0], [1.25, 0.75], [1.0, 0.586], [0.75, 0.75], [0.5, 1.0], [0.5, 2.0], [1.5, 3.0],
    [1.5, 4.0], [1.25, 4.25], [1.0, 4.414], [0.75, 4.25], [0.5, 4.0], [0.5, 2.85]].map(([u, v]) => uv(u, v));
  const segs = [];
  let len = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, az] = pts[i], [bx, bz] = pts[i + 1], l = Math.hypot(bx - ax, bz - az);
    segs.push({ ax, az, bx, bz, len: l, s0: len });
    len += l;
  }
  return { pts, segs, len };
})();

const START = uv(0.5, 1.45);
const _n = [0, 0, 0];

function pointInS(x, z) {
  let inside = false;
  for (let i = 0, j = OUTLINE.length - 1; i < OUTLINE.length; j = i++) {
    const xi = OUTLINE[i][0], zi = OUTLINE[i][1], xj = OUTLINE[j][0], zj = OUTLINE[j][1];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}

function nearestOnSeg(px, pz, ax, az, dx, dz, len2, out) {
  const t = clamp(((px - ax) * dx + (pz - az) * dz) / len2, 0, 1);
  out[0] = ax + dx * t; out[1] = az + dz * t; out[2] = t;
  return out;
}

function wallClearance(x, z) {
  let m = Infinity;
  for (const w of STROKES) {
    nearestOnSeg(x, z, w.ax, w.az, w.dx, w.dz, w.len2, _n);
    m = Math.min(m, Math.hypot(x - _n[0], z - _n[1]));
  }
  return m;
}

function pathPoint(s) {
  s = clamp(s, 0, PATH.len);
  let g = PATH.segs[PATH.segs.length - 1];
  for (const sg of PATH.segs) if (s <= sg.s0 + sg.len) { g = sg; break; }
  const t = clamp((s - g.s0) / g.len, 0, 1);
  return { x: g.ax + (g.bx - g.ax) * t, z: g.az + (g.bz - g.az) * t, tx: (g.bx - g.ax) / g.len, tz: (g.bz - g.az) / g.len };
}

function projectToPath(x, z) {
  let bestD = Infinity, bestS = 0;
  for (const g of PATH.segs) {
    const dx = g.bx - g.ax, dz = g.bz - g.az;
    nearestOnSeg(x, z, g.ax, g.az, dx, dz, g.len * g.len, _n);
    const d = Math.hypot(x - _n[0], z - _n[1]);
    if (d < bestD) { bestD = d; bestS = g.s0 + g.len * _n[2]; }
  }
  return { s: bestS, d: bestD };
}

// board-local -> world for a board rotated by Euler(a, 0, c) in three.js 'XYZ' order, i.e. Rx(a)·Rz(c)
function l2w(a, c, x, y, z, out) {
  const ca = Math.cos(a), sa = Math.sin(a), cc = Math.cos(c), sc = Math.sin(c);
  const x1 = x * cc - y * sc, y1 = x * sc + y * cc;
  out[0] = x1; out[1] = y1 * ca - z * sa; out[2] = y1 * sa + z * ca;
  return out;
}

function makeBall() {
  return { x: START[0], z: START[1], y: BALL_R, vx: 0, vz: 0, vy: 0, air: false };
}

// One physics step for the ball on the tilted S. Events go into `ev`.
function stepBall(b, a, c, dt, ev) {
  if (b.air) {
    b.vy -= PHYS.HOP_G * dt;
    b.x += b.vx * dt; b.z += b.vz * dt; b.y += b.vy * dt;
    if (!pointInS(b.x, b.z)) { ev.fall = true; return; }
    if (b.y > BALL_R) return;
    const impact = -b.vy;
    b.y = BALL_R;
    ev.land = Math.max(ev.land || 0, impact);
    if (impact > PHYS.BOUNCE_V) { b.vy = impact * 0.38; return; }
    b.vy = 0; b.air = false;
  }
  // gravity along the tilted board (exact for Rx(a)·Rz(c))
  b.vx += -PHYS.G * Math.cos(a) * Math.sin(c) * dt;
  b.vz += PHYS.G * Math.sin(a) * dt;
  const k = Math.exp(-PHYS.DAMP * dt);
  b.vx *= k; b.vz *= k;
  const sp = Math.hypot(b.vx, b.vz);
  if (sp > PHYS.VMAX) { b.vx *= PHYS.VMAX / sp; b.vz *= PHYS.VMAX / sp; }
  b.x += b.vx * dt; b.z += b.vz * dt;

  for (let pass = 0; pass < 2; pass++) {
    for (const w of STROKES) {
      nearestOnSeg(b.x, b.z, w.ax, w.az, w.dx, w.dz, w.len2, _n);
      let nx = b.x - _n[0], nz = b.z - _n[1];
      const d = Math.hypot(nx, nz);
      if (d >= CONTACT) continue;
      if (d > 1e-7) { nx /= d; nz /= d; } else { nx = -w.dz / w.len; nz = w.dx / w.len; }
      const vn = b.vx * nx + b.vz * nz;
      if (vn < -PHYS.HOP_V) {
        // too fast: ride up and over the line
        b.air = true; b.vy = PHYS.HOP_VY; b.y = BALL_R + 1e-3;
        b.vx *= 0.82; b.vz *= 0.82;
        ev.hop = -vn;
        return;
      }
      b.x = _n[0] + nx * CONTACT; b.z = _n[1] + nz * CONTACT;
      if (vn < 0) {
        const tx = b.vx - vn * nx, tz = b.vz - vn * nz;
        b.vx = tx * 0.985 - vn * PHYS.REST * nx;
        b.vz = tz * 0.985 - vn * PHYS.REST * nz;
        if (-vn > (ev.bonk || 0)) { ev.bonk = -vn; ev.bnx = nx; ev.bnz = nz; }
      }
    }
  }
  if (!pointInS(b.x, b.z)) ev.fall = true;
}

// Ball left the S: switch to world-space free fall toward the notebook page.
function toFall(b, a, c, by) {
  const p = l2w(a, c, b.x, b.y, b.z, [0, 0, 0]);
  const v = l2w(a, c, b.vx, b.air ? b.vy : 0, b.vz, [0, 0, 0]);
  return { x: p[0], y: p[1] + by, z: p[2], vx: v[0], vy: v[1], vz: v[2], floor: false, bounces: 0, still: 0 };
}

function stepFall(f, dt, ev) {
  f.vy -= PHYS.FALL_G * dt;
  f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
  const fy = PAPER_Y + BALL_R;
  if (f.y <= fy) {
    f.y = fy;
    if (f.vy < -1.5) {
      ev.thud = Math.max(ev.thud || 0, -f.vy);
      f.vy = -f.vy * 0.42; f.vx *= 0.72; f.vz *= 0.72; f.bounces++;

function makeGame(rnd = Math.random) {
  return { score: 0, token: null, time: 0, wob: [rnd() * 6.3, rnd() * 6.3, rnd() * 6.3, rnd() * 6.3] };
}

// seconds you get to reach a gold s that is `dist` away along the channel
function tokenTime(dist, score) {
  const t = 2.4 + dist * (0.66 - 0.28 * clamp(score / 30, 0, 1));
  return score < 2 ? t * 1.4 : t; // the first couple are a freebie while you figure out the controls
}

function spawnToken(game, b, rnd = Math.random) {
  const sb = projectToPath(b.x, b.z).s;
  const minD = Math.min(5, PATH.len * 0.3);
  for (let tries = 0; tries < 80; tries++) {
    const s = rnd() * PATH.len;
    const dist = Math.abs(s - sb);
    if (dist < minD) continue;
    const p = pathPoint(s);
    const off = (rnd() * 2 - 1) * 0.3;
    const x = p.x - p.tz * off, z = p.z + p.tx * off;
    if (!pointInS(x, z) || wallClearance(x, z) < CONTACT + 0.08) continue;
    const T = tokenTime(dist, game.score);
    return (game.token = { x, z, s, t: T, T, age: 0 });
  }
  const s = sb > PATH.len / 2 ? 0.2 : PATH.len - 0.2, p = pathPoint(s), T = tokenTime(Math.abs(s - sb), game.score);
  return (game.token = { x: p.x, z: p.z, s, t: T, T, age: 0 });
}

function stepGame(game, b, dt, ev, rnd = Math.random) {
  game.time += dt;
  const tk = game.token;
  if (!tk) return;
  tk.age += dt; tk.t -= dt;
  const lift = b.air ? Math.max(0, b.y - BALL_R - 0.5) : 0;
  if (Math.hypot(b.x - tk.x, b.z - tk.z, lift) < PHYS.PICK) {
    game.score++;
    ev.collect = { x: tk.x, z: tk.z, score: game.score };
    spawnToken(game, b, rnd);
    return;
  }
  if (tk.t <= 0) { tk.t = 0; ev.timeout = true; }
}

// After a few points the S starts to wobble on its own.
function wobble(game, t, out) {
  const amp = clamp((game.score - 6) * 0.0055, 0, 0.085), p = game.wob;
  out[0] = amp * (Math.sin(t * 1.9 + p[0]) * 0.6 + Math.sin(t * 3.1 + p[1]) * 0.4);
  out[1] = amp * (Math.sin(t * 2.3 + p[2]) * 0.6 + Math.sin(t * 3.7 + p[3]) * 0.4);
  return out;
}

// Out of time: the S gets bored and flicks the ball off the nearest edge.
function flickBall(b) {
  let bd = Infinity, px = 0, pz = 0;
  for (let i = 0; i < OUTLINE.length; i++) {
    const [ax, az] = OUTLINE[i], [bx, bz] = OUTLINE[(i + 1) % OUTLINE.length];
    const dx = bx - ax, dz = bz - az;
    nearestOnSeg(b.x, b.z, ax, az, dx, dz, dx * dx + dz * dz, _n);
    const d = Math.hypot(b.x - _n[0], b.z - _n[1]);
    if (d < bd) { bd = d; px = _n[0]; pz = _n[1]; }
  }
  let dx = px - b.x, dz = pz - b.z;
  const L = Math.hypot(dx, dz) || 1;
  dx /= L; dz /= L;
  b.air = true; b.vy = 7.5; b.y = Math.max(b.y, BALL_R + 1e-3);
  b.vx = dx * 6.5; b.vz = dz * 6.5;
  return [dx, dz];
}

  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;

function fitCamera() {

  camera.fov = aspect < 0.8 ? 40 : 34;
  camera.updateProjectionMatrix();
  const pitch = THREE.MathUtils.degToRad(aspect < 0.7 ? 66 : aspect < 1.1 ? 61 : 55);
  fit.dir.set(0, Math.sin(pitch), Math.cos(pitch));

  const ins = probe.getBoundingClientRect();
  const topPx = (w >= 900 ? 96 : 86) + ins.height, botPx = 16 + ins.width;
  const yTop = 1 - (2 * topPx) / h, yBot = -1 + (2 * botPx) / h, xLim = 1 - (2 * 12) / w;

    placeCam(fit.dist);

    const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * fit.dist;
    fit.target.addScaledVector(camUp, ((b.y0 + b.y1) / 2 - (yTop + yBot) / 2) * halfH);

}

document.addEventListener('gesturestart', (e) => e.preventDefault());

const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd' };
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = KEYMAP[e.code];
  if (k) {
    e.preventDefault();
    keys[k] = 1;
    if (state === 'intro' || state === 'title' || state === 'over') onPress();
  } else if (e.code === 'Space' || e.code === 'Enter') {
    if (document.activeElement === el.mute || document.activeElement === el.share) return;
    e.preventDefault();
    onPress();
  } else if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) keys[k] = 0; });

function toggleMute() {
  audio.init();
  audio.setMuted(!audio.muted);
  el.mute.setAttribute('aria-pressed', audio.muted ? 'true' : 'false');
  el.mute.setAttribute('aria-label', audio.muted ? 'Unmute sound' : 'Mute sound');
}
el.mute.addEventListener('pointerdown', (e) => e.stopPropagation());
el.mute.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });
el.mute.setAttribute('aria-pressed', audio.muted ? 'true' : 'false');
el.mute.setAttribute('aria-label', audio.muted ? 'Unmute sound' : 'Mute sound');

el.share.addEventListener('pointerdown', (e) => e.stopPropagation());
el.share.addEventListener('click', async (e) => {
  e.stopPropagation();
  const text = `i got ${/^[AFS]/.test(lastGrade) ? 'an' : 'a'} ${lastGrade} on s.computer (${lastScore} ${lastScore === 1 ? 's' : "s's"})`;
  const url = 'https://s.computer';
  if (navigator.share) {
    try { await navigator.share({ title: 's.computer', text, url }); return; } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  try { // no share sheet (desktop, or blocked in a frame): copy instead
    await navigator.clipboard.writeText(`${text} ${url}`);
    el.share.textContent = 'copied!';
    setTimeout(() => { el.share.textContent = 'share'; }, 1400);
  } catch (_) { /* no clipboard either */ }
});

/* ---------- game flow ---------- */

let lastGrade = 'F', lastScore = 0;
let state = 'intro', stateT = 0, introT = 0, dropThen = 'title', overAt = 0, fallReason = 'fly';
let ball = makeBall(), game = makeGame(), fall = null;
const tilt = { a: 0, c: 0, va: 0, vc: 0 };
let boardA = 0, boardC = 0, boardY = PAPER_Y + 0.004, camLift = PAPER_Y;
const bump = { y: 0, v: 0 }, sq = { y: 0, v: 0 }, follow = { x: 0, z: 0 };
let bob = 0, shake = 0, happyT = 0, blinkT = 2.5, tickT = 0, tokT = 0, tokPop = 1, trailT = 0, simT = 0, acc = 0;
const qRoll = new THREE.Quaternion(), qBoard = new THREE.Quaternion(), qWorld = new THREE.Quaternion(), euler = new THREE.Euler();
const fallSpin = new THREE.Vector3(1, 0, 0);
let fallSpinRate = 0;
const wob = [0, 0], w3 = [0, 0, 0], wv = [0, 0, 0], prevV = [0, 0, 0];
const ev = {};
const STEP = 1 / 120;
const corpses = [];
const PRAISE = ['rad!', 'sick!', 'tubular!', 'nice!', 'whoa!', 'clean!', 'S-tier!'];

function setState(s) { state = s; stateT = 0; }

// intro: a pen draws the 14 strokes on the page, then the S peels up off the paper
const T0 = 0.35, DRAW = 0.1, GAP = 0.055, PER = DRAW + GAP;
const DRAW_END = T0 + STROKES.length * PER + 0.12;
const LIFT = 1.05;
const INTRO_END = DRAW_END + LIFT;
const strokeProg = (i, t) => clamp((t - T0 - i * PER) / DRAW, 0, 1);

function updateIntro(dt) {
  introT += dt;
  for (let i = 0; i < STROKES.length; i++) setStroke(i, strokeProg(i, introT));
  placePen(introT);
  const lp = clamp((introT - DRAW_END) / LIFT, 0, 1);
  boardY = lerp(PAPER_Y + 0.004, 0, easeOutBack(lp));
  slab.visible = lp > 0.001;
  slab.scale.y = Math.max(0.02, easeOutCubic(Math.min(1, lp * 1.4)));
  camLift = PAPER_Y * (1 - easeOutCubic(lp));
  if (introT >= INTRO_END) finishIntro();
}

function placePen(t) {
  let x, z, h;
  const k = Math.floor((t - T0) / PER), local = t - T0 - k * PER;
  if (t < T0) {
    const s = STROKES[0], q = easeOutCubic(t / T0);
    x = lerp(s.ax + 1.5, s.ax, q); z = lerp(s.az - 1, s.az, q); h = 1.6 * (1 - q);
  } else if (k >= STROKES.length) {
    const s = STROKES[STROKES.length - 1], q = clamp((t - T0 - STROKES.length * PER) / 0.7, 0, 1);
    x = s.bx + q * 5; z = s.bz - q * 6; h = q * q * 9;
  } else if (local < DRAW) {
    const s = STROKES[k], p = local / DRAW;
    x = s.ax + s.dx * p; z = s.az + s.dz * p; h = 0;
  } else {
    const s = STROKES[k], n = STROKES[Math.min(k + 1, STROKES.length - 1)], q = (local - DRAW) / GAP;
    x = lerp(s.bx, n.ax, q); z = lerp(s.bz, n.az, q); h = Math.sin(q * Math.PI) * 0.45;
  }
  pen.position.set(x, boardY + INK_R * 1.7 + h, z);
  pen.visible = t < T0 + STROKES.length * PER + 0.7;
}

function finishIntro() {
  for (let i = 0; i < STROKES.length; i++) setStroke(i, 1);
  slab.visible = true; slab.scale.y = 1;
  boardY = 0; camLift = 0; pen.visible = false;
  if (reduceMotion) { ball = makeBall(); qRoll.identity(); ballRoot.visible = true; enterTitle(); } else startDrop('title');
}

function skipIntro() { introT = INTRO_END; updateIntro(0); }

function startDrop(then) {
  ball = makeBall();
  ball.air = true; ball.y = 5.2; ball.vy = 0;
  qRoll.identity();
  fall = null;
  ballRoot.visible = true;
  dropThen = then;
  setState('drop');
}

function enterTitle() {
  setState('title');
  game = makeGame();
  spawnToken(game, ball);
  showToken();
  el.cta.textContent = coarse ? 'drag anywhere to start' : 'click and drag to start';
  el.keys.hidden = coarse;
  el.title.classList.add('show');
  setBest();
}

function startPlay() {
  el.title.classList.remove('show');
  if (!game.token) spawnToken(game, ball);
  else {
    const tk = game.token;
    tk.T = tk.t = tokenTime(Math.abs(tk.s - projectToPath(ball.x, ball.z).s), game.score);
  }
  showToken();
  setScore(game.score);
  el.score.classList.add('on');
  setState('play');
}

function showToken() {
  const tk = game.token;
  if (!tk) { tokenRoot.visible = false; return; }
  tokenRoot.position.set(tk.x, 0, tk.z);
  tokenRoot.visible = true;
  tokPop = 0; tickT = 0;
}

function onPress() {
  audio.init();
  if (state === 'intro') skipIntro();
  else if (state === 'title') startPlay();
  else if (state === 'over' && performance.now() - overAt > 450) retry();
}

function retry() {
  el.over.classList.remove('show');
  addCorpse();
  game = makeGame();
  tokenRoot.visible = false;
  setScore(0);
  el.score.classList.add('on');
  startDrop('play');
}

// leave the last ball lying on the notebook page, like evidence
function addCorpse() {
  if (!fall || !fall.floor) return;
  const c = ballRoot.clone(true);
  c.traverse((o) => { if (o.material === M.ball) o.material = M.corpse; });
  scene.add(c);
  corpses.push(c);
  if (corpses.length > 12) scene.remove(corpses.shift());
}

function startFall(reason) {
  fallReason = reason;
  fall = toFall(ball, boardA, boardC, boardY + bump.y + bob);
  euler.set(boardA, 0, boardC);
  qWorld.setFromEuler(euler).multiply(qRoll);
  fallSpin.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
  fallSpinRate = 7 + Math.random() * 5;
  tokenRoot.visible = false;
  releaseStick();
  setState('fall');
  audio.whistle();
  haptic(35);
  shake = Math.max(shake, 0.12);
  popAt(reason === 'slow' ? 'too slow!' : pick(['nooo!', 'aaaa!', 'whoops!', 'bye!']), fall.x, fall.y + 0.7, fall.z, 'red');
}

function doFlick() {
  const [dx, dz] = flickBall(ball);
  game.token = null;
  tokenRoot.visible = false;
  tilt.vc += -dx * 3.2; tilt.va += dz * 3.2; // the S flicks you off
  setState('flick');
  audio.boing();
  shake = Math.max(shake, 0.18);
}

function showOver() {
  const s = game.score, isBest = s > best;
  if (isBest) { best = s; try { localStorage.setItem('s.best', String(best)); } catch (_) { /* ignore */ } }
  const [, g, remark] = gradeFor(s);
  lastGrade = g; lastScore = s;
  el.grade.textContent = g;
  el.remark.textContent = remark;
  el.reason.textContent = fallReason === 'slow' ? 'too slow. the S got bored.' : pick(['flew out!', 'yeeted.', 'wheeeee', 'launched!']);
  el.tally.textContent = `you got ${s} ${s === 1 ? 's' : "s's"}`;
  el.bestline.textContent = isBest && s > 0 ? 'new best!' : `best: ${best}`;
  el.again.textContent = coarse ? 'tap to try again' : 'click to try again';
  el.over.classList.add('show');
  setBest();
  overAt = performance.now();
  setState('over');
  if (s >= 15) audio.tada(); else if (s < 6) audio.sad();
}

function setScore(n, bumpIt) {
  el.score.textContent = String(n);
  if (bumpIt) { el.score.classList.remove('bump'); void el.score.offsetWidth; el.score.classList.add('bump'); }
}
function setBest() { el.best.textContent = best > 0 ? `best ${best}` : ''; }

const _pv = new THREE.Vector3();
function popAt(text, x, y, z, cls) {
  _pv.set(x, y, z).project(camera);
  if (_pv.z > 1) return;
  const d = document.createElement('div');
  d.className = cls ? `pop ${cls}` : 'pop';
  d.textContent = text;
  d.style.left = `${((_pv.x * 0.5 + 0.5) * innerWidth).toFixed(1)}px`;
  d.style.top = `${((-_pv.y * 0.5 + 0.5) * innerHeight).toFixed(1)}px`;
  el.pops.appendChild(d);
  setTimeout(() => d.remove(), 1100);
}
function popBall(text, cls) { popAt(text, ballRoot.position.x, ballRoot.position.y + 0.7, ballRoot.position.z, cls); }

/* ---------- simulation step + event handling ---------- */

function physStep(dt) {
  const live = state === 'play' || state === 'drop';
  const [ix, iy] = live ? readInput() : ZERO2;
  const W = 13; // tilt spring stiffness (critically damped)
  tilt.va += (W * W * (iy * MAX_TILT - tilt.a) - 2 * W * tilt.va) * dt; tilt.a += tilt.va * dt;
  tilt.vc += (W * W * (-ix * MAX_TILT - tilt.c) - 2 * W * tilt.vc) * dt; tilt.c += tilt.vc * dt;
  if (state === 'play') wobble(game, simT, wob); else { wob[0] *= 0.98; wob[1] *= 0.98; }
  boardA = tilt.a + wob[0]; boardC = tilt.c + wob[1];
  simT += dt;

  if (state === 'title' || state === 'drop' || state === 'play' || state === 'flick') {
    const wasAir = ball.air;
    stepBall(ball, boardA, boardC, dt, ev);
    if (ev.fall) { startFall(state === 'flick' ? 'slow' : 'fly'); return; }
    if (state === 'play') {
      stepGame(game, ball, dt, ev);
      if (ev.timeout) { ev.timeout = false; doFlick(); return; }
    }
    if (wasAir && !ball.air) {
      if (state === 'drop') { if (dropThen === 'play') startPlay(); else enterTitle(); } else if (state === 'flick') doFlick();
    }
  } else if (fall) stepFall(fall, dt, ev);
}

function handleEvents() {
  if (ev.collect) onCollect(ev.collect);
  if (ev.bonk && ev.bonk > 1) onBonk(ev.bonk, ev.bnx, ev.bnz);
  if (ev.hop) {
    audio.hop();
    sq.v -= 2.5;
    shake = Math.max(shake, 0.06);
    if (state === 'play') popBall('boing!');
  }
  if (ev.land && ev.land > 1.5) { audio.thud(ev.land * 0.6); sq.v += Math.min(5, ev.land * 0.35); }
  if (ev.thud) { audio.thud(ev.thud); sq.v += Math.min(6, ev.thud * 0.4); }
}

function onCollect(c) {
  const s = c.score;
  setScore(s, true);
  audio.collect(s);
  haptic(12);
  l2w(boardA, boardC, c.x, 0.66, c.z, w3);
  w3[1] += boardY + bump.y + bob;
  burst(w3[0], w3[1], w3[2], 18, GOLDS, 3.2, 3.8, 0.11, 0.9, 9);
  const label = s % 10 === 0 ? `${s}!` : s % 5 === 0 ? pick(PRAISE) : '+1';
  popAt(label, w3[0], w3[1] + 0.4, w3[2], s % 10 === 0 ? 'big gold' : 'gold');
  bump.v -= 1.1;
  happyT = 0.45;
  if (s % 10 === 0) {
    audio.tada();
    for (let i = 0; i < 80; i++) {
      spawnP((Math.random() - 0.5) * 7, 6 + Math.random() * 3, (Math.random() - 0.5) * 12, (Math.random() - 0.5) * 2, -1 - Math.random() * 2, (Math.random() - 0.5) * 2,
        pick(CONFETTI), 0.14 + Math.random() * 0.08, 2.6, 3.5, 0.9);
    }
  }
  showToken();
}

function onBonk(s, nx, nz) {
  audio.bonk(s);
  sq.v += Math.min(4, s * 0.45);
  if (s > 3) {
    l2w(boardA, boardC, ball.x - nx * BALL_R, INK_R * 1.5, ball.z - nz * BALL_R, w3);
    w3[1] += boardY + bump.y + bob;
    for (let i = 0; i < Math.min(8, s | 0); i++) {
      spawnP(w3[0], w3[1], w3[2], (Math.random() - 0.5) * 2.5, 1 + Math.random() * 2, (Math.random() - 0.5) * 2.5, 0x2335a8, 0.05 + Math.random() * 0.04, 0.45, 9, 1.5);
    }
  }
  if (s > 4.5) shake = Math.max(shake, s * 0.012);
  if (s > 2) haptic(8);
}

/* ---------- per-frame visuals ---------- */

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _qi = new THREE.Quaternion(), _f = new THREE.Vector3();

function rollQuat(q, vx, vz, dt) {
  const sp = Math.hypot(vx, vz);
  if (sp < 1e-4) return;
  _d.set(vz / sp, 0, -vx / sp);
  _q.setFromAxisAngle(_d, (sp / BALL_R) * dt);
  q.premultiply(_q);
}

function updateFace(dt) {
  // look mostly at the camera, leaning toward where it's rolling
  _v1.copy(camera.position).sub(ballRoot.position).normalize();
  const hs = Math.hypot(wv[0], wv[2]);
  if (hs > 0.05 && !(fall && !fall.floor)) {
    _v2.set(wv[0] / hs, 0, wv[2] / hs);
    _v1.addScaledVector(_v2, Math.min(0.65, hs * 0.13)).normalize();
  }
  face.lookAt(_v3.copy(ballRoot.position).add(_v1));

  const inv = 1 / Math.max(dt, 1e-3);
  let ax = (wv[0] - prevV[0]) * inv, ay = (wv[1] - prevV[1]) * inv, az = (wv[2] - prevV[2]) * inv;
  prevV[0] = wv[0]; prevV[1] = wv[1]; prevV[2] = wv[2];
  const am = Math.hypot(ax, ay, az);
  if (am > 500) { const k = 500 / am; ax *= k; ay *= k; az *= k; }

  const speed = Math.hypot(ball.vx, ball.vz);
  const scared = (fall && !fall.floor) || state === 'flick' || (!fall && speed > 6.2) || (!fall && ball.air && state === 'play');
  const dizzy = !!(fall && fall.floor);
  happyT -= dt; blinkT -= dt;
  if (blinkT < -0.12) blinkT = 2 + Math.random() * 3.5;
  const happy = happyT > 0 && !scared;
  const open = happy ? 0.22 : blinkT < 0 ? 0.1 : scared ? 1.18 : 1;
  smile.visible = !scared && !dizzy;
  ooh.visible = !smile.visible;
  ooh.scale.setScalar(dizzy ? 0.7 : 1);
  const heat = !fall && speed > 5 ? clamp((speed - 5) / 3, 0, 1) * 0.35 : 0;
  M.ball.emissiveIntensity = lerp(M.ball.emissiveIntensity, heat, 1 - Math.exp(-10 * dt));

  for (const e of eyes) {
    const s = e.g.scale;
    s.y = lerp(s.y, open, 1 - Math.exp(-25 * dt));
    s.x = lerp(s.x, scared ? 1.12 : 1, 1 - Math.exp(-12 * dt));
    e.pupil.visible = s.y > 0.4;
    if (dizzy) {
      const a = stateT * 9 * e.side;
      e.px = Math.cos(a) * PUPIL_MAX * 0.8; e.py = Math.sin(a) * PUPIL_MAX * 0.8;
    } else {
      // googly physics: the pupil is a loose weight inside the eye, pushed by gravity and the ball's acceleration
      e.g.getWorldQuaternion(_qi).invert();
      _f.set(-ax, -9.8 - ay, -az).applyQuaternion(_qi);
      e.vx += _f.x * dt; e.vy += _f.y * dt;
      const k = Math.exp(-3 * dt);
      e.vx *= k; e.vy *= k;
      e.px += e.vx * dt; e.py += e.vy * dt;
      const r = Math.hypot(e.px, e.py);
      if (r > PUPIL_MAX) {
        const nx = e.px / r, ny = e.py / r;
        e.px = nx * PUPIL_MAX; e.py = ny * PUPIL_MAX;
        const vn = e.vx * nx + e.vy * ny;
        if (vn > 0) { e.vx -= 1.55 * vn * nx; e.vy -= 1.55 * vn * ny; }
      }
    }
    const rr = Math.min(1, Math.hypot(e.px, e.py) / EYE_R);
    e.pupil.position.set(e.px, e.py, EYE_R * 0.55 * Math.sqrt(1 - rr * rr) - 0.004);
  }
}

function updateVisuals(dt) {
  bump.v += (-bump.y * 150 - bump.v * 15) * dt; bump.y += bump.v * dt;
  sq.v += (-sq.y * 280 - sq.v * 17) * dt; sq.y = clamp(sq.y + sq.v * dt, -0.35, 0.45);
  bob = lerp(bob, state === 'title' ? Math.sin(stateT * 1.7) * 0.09 : 0, 1 - Math.exp(-4 * dt));
  const by = boardY + bump.y + bob;
  board.position.set(0, by, 0);
  board.rotation.set(boardA, 0, boardC);
  euler.set(boardA, 0, boardC);
  qBoard.setFromEuler(euler);

  if (ballRoot.visible) {
    if (fall) {
      ballRoot.position.set(fall.x, fall.y, fall.z);
      if (fall.floor) rollQuat(qWorld, fall.vx, fall.vz, dt);
      else { _q.setFromAxisAngle(fallSpin, fallSpinRate * dt); qWorld.premultiply(_q); }
      body.quaternion.copy(qWorld);
      wv[0] = fall.vx; wv[1] = fall.vy; wv[2] = fall.vz;
    } else {
      l2w(boardA, boardC, ball.x, ball.y, ball.z, w3);
      ballRoot.position.set(w3[0], w3[1] + by, w3[2]);
      if (!ball.air) rollQuat(qRoll, ball.vx, ball.vz, dt);
      body.quaternion.copy(qBoard).multiply(qRoll);
      l2w(boardA, boardC, ball.vx, ball.air ? ball.vy : 0, ball.vz, wv);
    }
    squash.scale.set(1 + sq.y * 0.5, 1 - sq.y, 1 + sq.y * 0.5);
    squash.position.y = -sq.y * BALL_R;
    updateFace(dt);
  }

  if (tokenRoot.visible) {
    tokT += dt; tokPop += dt;
    const tk = game.token;
    const f = tk && state === 'play' ? clamp(tk.t / tk.T, 0, 1) : 1;
    const urgent = state === 'play' && f < 0.3;
    tokenSpin.position.y = 0.66 + Math.sin(tokT * 3.2) * 0.07 + (urgent ? Math.sin(tokT * 40) * 0.025 : 0);
    tokenSpin.rotation.y = tokT * 2.6;
    tokenRoot.scale.setScalar(tokPop < 0.4 ? Math.max(0.001, easeOutBack(tokPop / 0.4)) : 1);
    ring.visible = track.visible = state === 'play';
    ringGeo.setDrawRange(0, Math.ceil(f * RING_SEG) * 6);
    M.ring.color.lerpColors(INK_C, RED_C, clamp((0.35 - f) / 0.25, 0, 1));
    if (urgent) {
      tickT -= dt;
      if (tickT <= 0) { audio.tick(); tickT = f < 0.12 ? 0.16 : 0.32; }
    }
  }

  // speed trail
  trailT -= dt;
  if (!fall && ballRoot.visible && state === 'play' && !ball.air) {
    const sp = Math.hypot(ball.vx, ball.vz);
    if (sp > 4.6 && trailT <= 0) {
      trailT = 0.028;
      const bp = ballRoot.position;
      spawnP(bp.x + (Math.random() - 0.5) * 0.2, bp.y - 0.15 + (Math.random() - 0.5) * 0.2, bp.z + (Math.random() - 0.5) * 0.2,
        (Math.random() - 0.5) * 0.4, 0.3 + Math.random() * 0.4, (Math.random() - 0.5) * 0.4, sp > 6.2 ? 0xff2d6f : 0xff8cbc, 0.07 + Math.random() * 0.05, 0.35, 0, 2);
    }
  }
  updateParticles(dt);

  const rolling = (state === 'play' || state === 'title' || state === 'drop') && !ball.air ? Math.hypot(ball.vx, ball.vz) : fall && fall.floor ? Math.hypot(fall.vx, fall.vz) * 0.5 : 0;
  audio.roll(document.hidden ? 0 : rolling);

  // camera: fixed framing, a little drift toward the ball, shake on big moments
  const T = _v3.copy(fit.target);
  T.y += camLift;
  const kf = 1 - Math.exp(-2.5 * dt);
  follow.x = lerp(follow.x, !fall && ballRoot.visible ? ball.x * 0.05 : 0, kf);
  follow.z = lerp(follow.z, !fall && ballRoot.visible ? ball.z * 0.035 : 0, kf);
  camera.position.copy(T).addScaledVector(fit.dir, fit.dist);
  camera.position.x += follow.x;
  camera.position.z += follow.z;
  if (shake > 0.002 && !reduceMotion) camera.position.add(_v2.set((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake));
  shake *= Math.exp(-7 * dt);
  camera.lookAt(T.x + follow.x * 1.6, T.y, T.z + follow.z * 1.6);

  if (state === 'fall' && fall && ((fall.floor && fall.still > 0.35) || stateT > 3.4)) showOver();
}

/* ---------- main loop ---------- */

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  stateT += dt;
  if (state === 'intro') updateIntro(dt);
  else {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 12) { physStep(STEP); acc -= STEP; n++; }
    if (n === 12) acc = 0;
  }
  handleEvents();
  for (const k in ev) delete ev[k];
  updateVisuals(dt);
  renderer.render(scene, camera);
  if (!window.__sReady) {
    window.__sReady = true;
    const fb = $('fallback');
    if (fb) fb.hidden = true;
  }
}

function onResize() {
  renderer.setSize(innerWidth, innerHeight, false);
  fitCamera();
  stickR = Math.max(56, Math.min(96, Math.min(innerWidth, innerHeight) * 0.17));
}
window.addEventListener('resize', onResize);
el.c.addEventListener('webglcontextlost', (e) => { e.preventDefault(); window.__sFallback('the S lost its graphics context. reload the page to get it back.'); });
onResize();
setBest();
if (reduceMotion) finishIntro();
renderer.setAnimationLoop(frame);

// handy for poking at it from the console
window.__s = {
  get state() { return state; },
  get score() { return game.score; },
  get ball() { return ball; },
  get token() { return game.token; },
  get fall() { return fall; },
};
</script>
</body>
</html>
